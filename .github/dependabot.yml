version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types follow the oldest supported Node.js major (engines), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']
