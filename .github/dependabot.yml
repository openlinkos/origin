version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types track the Node.js major we build and test on (24), not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # The shared site theme is released on its own schedule; review its updates separately.
      openlinkos:
        patterns: ['@openlinkos/*']
      dependencies:
        patterns: ['*']
        exclude-patterns: ['@openlinkos/*']
