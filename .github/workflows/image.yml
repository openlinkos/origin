name: Image

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/image.yml'
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build, test, and publish the hub image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/openlinkos/origin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: origin:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name hub -p 7077:7077 origin:test
          for i in $(seq 1 30); do curl -fs http://localhost:7077/healthz && break; sleep 0.5; done
          curl -fsS http://localhost:7077/healthz | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:7077/mcp)" = 401
          TOKEN="$(docker exec hub origin token create ci | grep -o 'ogn_[A-Za-z0-9_-]*')"
          curl -fsS -X POST http://localhost:7077/mcp \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | grep -q '"name":"origin"'
          docker rm -f hub

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
