name: Site

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish the site image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/openlinkos/origin-site
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value={{date 'YYYYMMDDHHmmss' tz='UTC'}}-{{sha}}

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docs/Dockerfile
          load: true
          tags: site:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name site -p 8080:8080 site:test
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 0.5; done
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS http://localhost:8080/zh/ | grep -q 'lang="zh-CN"'
          curl -fsS http://localhost:8080/guide/cli | grep -q 'CLI reference'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-such-page)" = 404
          curl -fsSI http://localhost:8080/ | grep -qi '^cache-control: no-cache'
          docker rm -f site

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
