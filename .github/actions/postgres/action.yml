name: Start PostgreSQL
description: >-
  Start a PostgreSQL 17 server for the tests, its cluster in UTF8 with the C locale and without
  fsync, and set ORIGIN_TEST_DATABASE_URL to it, so that `pnpm test` runs on PostgreSQL.

runs:
  using: composite
  steps:
    # A container rather than a service container, which takes no server arguments.
    - name: Start PostgreSQL in Docker
      if: runner.os == 'Linux'
      shell: bash
      run: |
        docker run -d --name origin-pg -p 127.0.0.1:5432:5432 \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_INITDB_ARGS='--locale=C --encoding=UTF8' \
          postgres:17 \
          -c max_connections=500 -c fsync=off -c full_page_writes=off
        # Over TCP: the server the image starts while it initializes listens on a socket only.
        for _ in $(seq 1 60); do
          docker exec origin-pg pg_isready -q -h 127.0.0.1 -U postgres && break
          sleep 1
        done
        docker exec origin-pg pg_isready -h 127.0.0.1 -U postgres || { docker logs origin-pg; exit 1; }
        echo 'ORIGIN_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres' >> "$GITHUB_ENV"

    # The image's own PostgreSQL 17 (PGBIN), in a cluster of its own: its service is disabled, and
    # its cluster's locale is the machine's.
    - name: Start PostgreSQL from the runner's binaries
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $data = Join-Path $env:RUNNER_TEMP 'pg'
        $log = Join-Path $env:RUNNER_TEMP 'pg.log'
        & "$env:PGBIN\initdb.exe" -D $data -U postgres -A trust -E UTF8 --locale=C --no-instructions
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "$env:PGBIN\pg_ctl.exe" -D $data -l $log -w -t 60 start `
          -o '-p 55432 -c listen_addresses=127.0.0.1 -c max_connections=500 -c fsync=off -c full_page_writes=off'
        if ($LASTEXITCODE -ne 0) { Get-Content $log; exit $LASTEXITCODE }
        Add-Content -Path $env:GITHUB_ENV -Value 'ORIGIN_TEST_DATABASE_URL=postgres://postgres@127.0.0.1:55432/postgres'
